# ============================================================================
# 构建 Doxygen 接口文档并发布到文档服务器的 /atk-component/ 子路径
#
# 触发：push 到 master，或在仓库「流水线 / Actions」页面手动运行
# 产物：.dist/atk-component-doc/html
# 访问：http://<DOCS_SERVER>/atk-component/
#
# 需要的仓库 Secrets（仓库 设置 → Actions → Secrets）：
#   DOCS_SERVER      文档服务器地址，只写 IP 或域名，不带 http:// 和路径
#   DOCS_SERVER_PWD  服务器 root 密码
#
# 部署位置的由来：atk-doc 那个站点的 nginx 根目录是 /root/atk-help，本仓库把产物
# 解包到它下面的 atk-component/ 子目录，因此同一个域名下就能访问，不需要新域名、
# 不需要改 nginx 配置、也不需要重启服务。
# ============================================================================
name: 构建并发布接口文档

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一分支连推多次时只保留最后一次，避免并发部署互相覆盖
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # 版本锁死，别顺手升级：tools/doxygen/ 下的 header.html、layout.xml、style.css
  # 是照 Doxygen 1.17.0 的官方模板改的，换版本会破坏页面结构。
  # 官方发布页：https://github.com/doxygen/doxygen/releases/tag/Release_1_17_0
  DOXYGEN_VERSION: 1.17.0
  # 官方 Release 资产的 SHA256（取自 GitHub Release asset digest）
  DOXYGEN_SHA256: 75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
  # 服务器上的发布目录（= nginx 站点根 /root/atk-help 下的子目录）
  SITE_PATH: /root/atk-help/atk-component

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: https://gitlink.org.cn/actions/checkout@v4

      - name: 安装 Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          dot -V

      - name: 安装 Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          set -euo pipefail

          # 先走 GitHub 官方 Release，失败再退回 SourceForge 官方镜像
          GITHUB_URL="https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz"
          SOURCEFORGE_URL="https://sourceforge.net/projects/doxygen/files/rel-1.17.0/doxygen-1.17.0.linux.bin.tar.gz/download"

          download() {
            echo "下载: $1"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o /tmp/doxygen.tar.gz "$1"
          }
          download "$GITHUB_URL" || download "$SOURCEFORGE_URL" || {
            echo "::error::Doxygen $DOXYGEN_VERSION 下载失败（GitHub 与 SourceForge 均不可达）"
            exit 1
          }

          # 校验下载内容，防止半截文件或镜像串版本
          echo "$DOXYGEN_SHA256  /tmp/doxygen.tar.gz" | sha256sum -c -

          sudo mkdir -p /opt/doxygen
          sudo tar -xzf /tmp/doxygen.tar.gz -C /opt/doxygen --strip-components=1
          sudo ln -sf /opt/doxygen/bin/doxygen /usr/local/bin/doxygen

          # 断言版本，避免哪天镜像换了内容却静默通过
          doxygen --version
          doxygen --version | grep -q "^${DOXYGEN_VERSION} " || {
            echo "::error::Doxygen 版本不是 ${DOXYGEN_VERSION}"
            exit 1
          }

      - name: 生成文档
        run: |
          set -euo pipefail

          # Doxyfile 里 DOT_PATH 写死的是 Windows 路径 C:/Program Files/Graphviz/bin，
          # 在 Linux runner 上会让 500 多张类继承图静默消失（构建仍然成功，不报错）。
          # 这里把 DOT_PATH 追加到配置末尾覆盖掉它，仓库里的 Doxyfile 保持原样，
          # 本地 Windows 构建不受影响。doxygen - 表示从标准输入读取配置。
          {
            cat Doxyfile
            echo
            echo "DOT_PATH = $(dirname "$(command -v dot)")"
          } | doxygen -

      - name: 检查产物
        run: |
          set -euo pipefail
          HTML=.dist/atk-component-doc/html

          test -s "$HTML/index.html" || { echo "::error::没有生成 index.html"; exit 1; }
          test -d "$HTML/search" || { echo "::error::缺少 search 目录，SEARCHENGINE 未生效"; exit 1; }

          # 类图数量是 dot 是否生效的唯一可靠信号：Doxyfile 里 HAVE_DOT=YES，
          # 本地用 Graphviz 16.1.1 构建得到 507 张，这里留出余量按 400 卡。
          PNG_COUNT=$(find "$HTML" -maxdepth 1 -name '*.png' | wc -l)
          echo "类图数量: $PNG_COUNT"
          test "$PNG_COUNT" -ge 400 || {
            echo "::error::类图只有 $PNG_COUNT 张，Graphviz/dot 没生效"
            exit 1
          }

          echo "HTML 文件数: $(find "$HTML" -type f | wc -l)"
          echo "HTML 体积: $(du -sh "$HTML" | cut -f1)"

          # 告警只打印不拦截：本地基线 7 条，条数波动不该阻断发布
          if [ -f .dist/doxygen-warnings.log ]; then
            echo "Doxygen 告警 $(wc -l < .dist/doxygen-warnings.log) 条（本地基线 7 条）"
            cat .dist/doxygen-warnings.log
          fi

      - name: 上传产物（可选，便于内网离线下载）
        continue-on-error: true
        uses: https://gitlink.org.cn/actions/upload-artifact@v4
        with:
          name: atk-component-doc-html
          path: .dist/atk-component-doc/html

      - name: 打包站点
        run: |
          set -euo pipefail
          tar -czf docs-site.tar.gz -C .dist/atk-component-doc/html .
          ls -lh docs-site.tar.gz

      - name: 上传到文档服务器
        uses: https://gitlink.org.cn/actions/scp-action@master
        with:
          host: '${{ secrets.DOCS_SERVER }}'
          port: '22'
          username: 'root'
          password: '${{ secrets.DOCS_SERVER_PWD }}'
          source: 'docs-site.tar.gz'
          target: '/tmp/'
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: 解包发布
        uses: https://gitlink.org.cn/actions/ssh-action@v1.0.3
        with:
          host: '${{ secrets.DOCS_SERVER }}'
          port: '22'
          username: 'root'
          password: '${{ secrets.DOCS_SERVER_PWD }}'
          script: |
            set -e
            TARGET="${{ env.SITE_PATH }}"
            mkdir -p "$TARGET"
            # 先清空再解包，避免上一版删掉的页面残留在站点里
            find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf /tmp/docs-site.tar.gz -C "$TARGET"
            rm -f /tmp/docs-site.tar.gz
            test -s "$TARGET/index.html"
            echo "已发布到 $TARGET（$(ls -1 "$TARGET" | wc -l) 个顶层条目）"
            echo "访问地址：http://<服务器>/atk-component/"
